<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>360° food — Site &amp; CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fbfaf6; --surface: #ffffff; --ink: #1c2b1f; --muted: #6f8072; --border: #e4e8df;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Inter", sans-serif; overflow-x: hidden; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: #8a988c; font-weight: 700; padding: 0 9px 10px; white-space: nowrap; }
  td.wrap { white-space: normal; min-width: 190px; max-width: 300px; }
  td.act { white-space: normal; min-width: 150px; }
  td { padding: 11px 9px; font-size: 13.5px; border-top: 1px solid #eef1ea; white-space: nowrap; }
  tr:hover td { background: #fafcf7; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #d6ddd1; border-radius: 8px; }
  .navbtn:hover { background: #f1f6ee !important; }
  input:focus, select:focus, textarea:focus { border-color: #8bc543 !important; box-shadow: 0 0 0 3px rgba(139,197,67,0.18); }
  @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .float { animation: floatY 4.5s ease-in-out infinite; }
  .fade-in { animation: fadeInUp 0.7s ease both; }
  .spin-slow { animation: spinSlow 40s linear infinite; }
  .lp-btn { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .lp-btn:hover { transform: translateY(-2px); }
  .lp-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .lp-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .lp-card:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(26,77,46,0.1); }
  .lp-navlink { position: relative; }
  .lp-navlink::after { content:''; position:absolute; left:0; bottom:-4px; width:0; height:2px; background:#8bc543; transition: width 0.2s ease; }
  .lp-navlink:hover::after { width:100%; }
  .table-scroll { overflow-x: auto; }
  @media (max-width: 640px) { .folder-grid, .folder-foot { grid-template-columns: 1fr !important; } .folder-bottom { grid-template-columns: 1fr !important; } .folder-feat { grid-template-columns: repeat(2, 1fr) !important; row-gap: 10px; } }
  @media print {
    @page { size: A4; margin: 8mm; }
    html, body { background: #f5eedb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body * { visibility: hidden !important; }
    #folder-sheet, #folder-sheet * { visibility: visible !important; }
    #folder-sheet { position: absolute !important; left: 0; top: 0; width: 100% !important; max-width: none !important; box-shadow: none !important; border-radius: 0 !important; }
    .folder-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
    .folder-foot { grid-template-columns: 1fr 1fr !important; }
    .folder-pack { grid-template-columns: 250px 1fr !important; }
    .folder-feat { grid-template-columns: repeat(4, 1fr) !important; }
  }
  @media (max-width: 900px) {
    .lp-hero-grid { grid-template-columns: 1fr !important; }
    .lp-hero-visual { display: none !important; }
    .lp-hero-grid > * { min-width: 0; }
    .crm-topnav { display: flex !important; }
    .lp-grid-3 { grid-template-columns: 1fr !important; }
    .lp-builder-grid { grid-template-columns: 1fr !important; }
    .lp-nav-links { display: none !important; }
    .crm-sidebar { display: none !important; }
  }
  .crm-topnav { display: none; }
  .crm-pad { height: 12px; }
  @media (max-width: 640px) {
    html { -webkit-text-size-adjust: 100%; }
    header > div { padding: 10px 14px !important; gap: 8px; }
    section { padding-left: 16px !important; padding-right: 16px !important; }
    section > div { padding-left: 16px !important; padding-right: 16px !important; }
    #hero > div { padding-left: 0 !important; padding-right: 0 !important; }
    .lp-login-txt { display: none; }
    .lp-login { padding: 10px 11px !important; }
    .lp-hero-grid { gap: 20px !important; }
    .lp-cta { width: 100%; justify-content: center; }
    .lp-cta-row { flex-direction: column; }
    .lp-cta-row > * { width: 100%; justify-content: center; }
    h2 { font-size: 24px !important; }
    input, select, textarea { font-size: 16px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

function usePersisted(table, mapper, onError) {
  const [items, setItems] = useState([]);

      let next = typeof updater === "function" ? updater(cur) : updater;

        id: newId()
      }));

      setItems(next);

      const nextIds = new Set(next.map(x => x.id));
      const ups = next.filter(x => {
        const q = prevMap.get(x.id);
        return !q || JSON.stringify(q) !== JSON.stringify(x);
      });
      const dels = cur.filter(x => !nextIds.has(x.id));
      if (!ups.length && !dels.length) return;
      queue.current = queue.current.then(async () => {
        if (ups.length) await sb("/rest/v1/" + table + "?on_conflict=id", {
          method: "POST",
          headers: {
            Prefer: "resolution=merge-duplicates,return=minimal"
          },
          body: ups.map(mapper.to)
        });
        if (dels.length) await sb("/rest/v1/" + table + "?id=in.(" + dels.map(x => x.id).join(",") + ")", {
          method: "PATCH",
          headers: {
            Prefer: "return=minimal"
          },
          body: {
            deleted: true
          }
        });
      }).catch(e => {
        errRef.current && errRef.current(e);
      });
    };

    ref.current = arr;
    setItems(arr);
  });
  return [items, setter.current, replace.current, queue];
}

          title: "Cardápio 360 Food"

  }
